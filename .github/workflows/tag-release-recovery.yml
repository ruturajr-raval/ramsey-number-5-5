name: tag-release-recovery

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: tag-release-recovery-v0.1.0

jobs:
  verify:
    if: >-
      github.repository == 'ruturajr-raval/ramsey-number-5-5' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Assert recovery context
        run: |
          test "$GITHUB_REPOSITORY" = \
            "ruturajr-raval/ramsey-number-5-5"
          test "$GITHUB_REF" = "refs/heads/main"

      - name: Check out recovery controller
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: controller

      - name: Check out protected release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: refs/tags/v0.1.0
          fetch-depth: 0
          path: release

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: release/requirements-dev.txt

      - name: Validate recovery controller
        run: |
          PYTHONPATH=controller/tools python -m unittest \
            controller/tests/test_tag_release_recovery.py -v
          python controller/tools/check_repository_text.py

      - name: Download retained tag-run evidence
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 34252608262 \
            --repo ruturajr-raval/ramsey-number-5-5 \
            --name release-candidate-evidence \
            --dir build

      - name: Verify recovery controller and tag evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python controller/tools/verify_tag_release_recovery.py \
            --phase preflight \
            --record controller/research/tag-release-recovery.json \
            --release-root release \
            --candidate-evidence release/build/release-candidate-evidence.json \
            --output release/build/tag-recovery-controller-evidence.json

      - name: Install Python dependencies
        run: python -m pip install -r release/requirements-dev.txt

      - name: Recheck tagged package
        working-directory: release
        run: |
          make test PYTHON=python
          make verify-text PYTHON=python

      - name: Build and verify tagged release assets
        working-directory: release
        run: |
          make release-assets \
            PYTHON=python \
            RELEASE_REF=refs/tags/v0.1.0 \
            RELEASE_TAG=v0.1.0

      - name: Verify final protected-tag recovery
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python controller/tools/verify_tag_release_recovery.py \
            --phase final \
            --record controller/research/tag-release-recovery.json \
            --release-root release \
            --candidate-evidence release/build/release-candidate-evidence.json \
            --preflight-evidence \
              release/build/tag-recovery-controller-evidence.json \
            --output release/build/tag-recovery-final-evidence.json

      - name: Assert verified trees unchanged
        run: |
          git -C controller diff --exit-code
          git -C release diff --exit-code
          test -z "$(git -C controller status --short --untracked-files=all)"
          test -z "$(git -C release status --short --untracked-files=all)"

      - name: Upload tag-verified release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ramsey-number-5-5-v0.1.0-verified-release
          path: |
            controller/research/tag-release-recovery.json
            release/dist/release
            release/build/release-candidate-evidence.json
            release/build/paper/main.log
            release/build/paper/paper-build.json
            release/build/tag-recovery-controller-evidence.json
            release/build/tag-recovery-final-evidence.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
