name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Unit and repository checks
        run: |
          make test PYTHON=python
          make verify-text PYTHON=python

      - name: Build pinned drat-trim
        run: |
          git clone https://github.com/marijnheule/drat-trim.git build/drat-trim-src
          git -C build/drat-trim-src checkout 2e3b2dc0ecf938addbd779d42877b6ed69d9a985
          make -C build/drat-trim-src

      - name: Regenerate all formulas and replay all proofs
        run: |
          make verify-proofs \
            PYTHON=python \
            DRAT_TRIM="$PWD/build/drat-trim-src/drat-trim"

      - name: Install pinned Tectonic
        run: |
          mkdir -p build/tectonic
          curl -L --fail --silent --show-error \
            -o build/tectonic/tectonic.tar.gz \
            https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.17.0/tectonic-0.17.0-x86_64-unknown-linux-musl.tar.gz
          echo \
            "8533d07f9ccbd7a65824b9e0459041bca34af1eb33daba48f59215593753a3b7  build/tectonic/tectonic.tar.gz" \
            | sha256sum -c -
          tar -xzf build/tectonic/tectonic.tar.gz -C build/tectonic
          echo \
            "a98aa59ad5c1df39a6c9e56cbfc5088f2b11d6c179c0130b97998e4bd46a46da  build/tectonic/tectonic" \
            | sha256sum -c -
          test "$(build/tectonic/tectonic --version)" = "Tectonic 0.17.0"

      - name: Build technical report
        run: |
          XDG_CACHE_HOME="$PWD/build/tectonic-cache" make paper-tectonic \
            PYTHON=python \
            TECTONIC="$PWD/build/tectonic/tectonic"

      - name: Verify release candidate evidence
        run: make verify-release-candidate PYTHON=python

      - name: Upload candidate evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-candidate-evidence
          path: |
            build/paper/main.pdf
            build/paper/paper-build.json
            build/proof-replay-c6
            build/proof-replay-c8
            build/release-candidate-evidence.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

      - name: Verify release manifest
        run: make verify-release-manifest PYTHON=python

      - name: Assert deterministic release manifest
        run: |
          make release-manifest PYTHON=python
          git diff --exit-code -- release-manifest.sha256

      - name: Build and verify deterministic release assets
        run: |
          make release-assets PYTHON=python
          make verify-release-assets PYTHON=python

      - name: Verify final release gate
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python tools/verify_github_ruleset.py
          make verify-release-gate \
            PYTHON=python \
            RELEASE_TAG="${GITHUB_REF_NAME}"

      - name: Upload tag-verified release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ramsey-number-5-5-${{ github.ref_name }}-verified-release
          path: |
            dist/release
            build/release-final-evidence.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

      - name: Assert tracked tree unchanged
        if: always()
        run: git diff --exit-code
