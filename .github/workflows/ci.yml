name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Unit and repository checks
        run: |
          make test PYTHON=python
          make verify-text PYTHON=python
          make verify-elementary PYTHON=python

      - name: Build pinned drat-trim
        run: |
          git clone https://github.com/marijnheule/drat-trim.git build/drat-trim-src
          git -C build/drat-trim-src checkout 2e3b2dc0ecf938addbd779d42877b6ed69d9a985
          make -C build/drat-trim-src

      - name: Regenerate formulas and replay proofs
        run: |
          make verify-proofs \
            PYTHON=python \
            DRAT_TRIM="$PWD/build/drat-trim-src/drat-trim"

      - name: Install TeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended

      - name: Build technical report
        run: make paper

      - name: Upload technical report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: technical-report
          path: build/paper/main.pdf
          if-no-files-found: error

      - name: Verify release manifest
        run: make verify-release-manifest PYTHON=python

      - name: Assert deterministic release manifest
        run: |
          make release-manifest PYTHON=python
          git diff --exit-code -- release-manifest.sha256

      - name: Assert tracked tree unchanged
        if: always()
        run: git diff --exit-code
